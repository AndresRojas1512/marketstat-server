version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=marketstat
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ../test-infra/docker/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketstat"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - benchmark-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api-baseline:
    image: marketstat-api:benchmark
    build:
      context: ../
      dockerfile: src/MarketStat/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MarketStat=Host=db;Port=5432;Database=marketstat;Username=marketstat_administrator;Password=andresrmlnx15;CommandTimeout=300;Pooling=true;MinPoolSize=10;MaxPoolSize=100
      - JwtSettings__Key=BiTFRKXvMfhuw3Juh6XrF4HE4Xd2-Ey98pS9QBsKfdo
      - JwtSettings__Issuer=marketstat-demo
      - JwtSettings__Audience=marketstat-demo
      - REPO_IMPLEMENTATION=BASELINE
      - OTEL_RESOURCE_ATTRIBUTES=service.name=MarketStat.API.BASELINE
    ports:
      - "5055:8080"
    networks:
      - benchmark-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  api-efsql:
    image: marketstat-api:benchmark
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MarketStat=Host=db;Port=5432;Database=marketstat;Username=marketstat_administrator;Password=andresrmlnx15;CommandTimeout=300;Pooling=true;MinPoolSize=10;MaxPoolSize=100
      - JwtSettings__Key=BiTFRKXvMfhuw3Juh6XrF4HE4Xd2-Ey98pS9QBsKfdo
      - JwtSettings__Issuer=marketstat-demo
      - JwtSettings__Audience=marketstat-demo
      - REPO_IMPLEMENTATION=EF_SQL
      - OTEL_RESOURCE_ATTRIBUTES=service.name=MarketStat.API.EF_SQL
    ports:
      - "5056:8080"
    networks:
      - benchmark-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  api-dapper:
    image: marketstat-api:benchmark
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__MarketStat=Host=db;Port=5432;Database=marketstat;Username=marketstat_administrator;Password=andresrmlnx15;CommandTimeout=300;Pooling=true;MinPoolSize=10;MaxPoolSize=100
      - JwtSettings__Key=BiTFRKXvMfhuw3Juh6XrF4HE4Xd2-Ey98pS9QBsKfdo
      - JwtSettings__Issuer=marketstat-demo
      - JwtSettings__Audience=marketstat-demo
      - REPO_IMPLEMENTATION=DAPPER
      - OTEL_RESOURCE_ATTRIBUTES=service.name=MarketStat.API.DAPPER
    ports:
      - "5057:8080"
    networks:
      - benchmark-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M

  k6-baseline:
    image: grafana/k6:latest
    user: "root"
    volumes:
      - ./k6-scripts:/scripts
      - ./results:/results
    environment:
      - API_URL=http://api-baseline:8080/api
    networks:
      - benchmark-net
    profiles: ["tools"]

  k6-efsql:
    image: grafana/k6:latest
    user: "root"
    volumes:
      - ./k6-scripts:/scripts
      - ./results:/results
    environment:
      - API_URL=http://api-efsql:8080/api
    networks:
      - benchmark-net
    profiles: ["tools"]

  k6-dapper:
    image: grafana/k6:latest
    user: "root"
    volumes:
      - ./k6-scripts:/scripts
      - ./results:/results
    environment:
      - API_URL=http://api-dapper:8080/api
    networks:
      - benchmark-net
    profiles: ["tools"]

networks:
  benchmark-net: